            $ref: '#/definitions/helper.Response'
      security:
      - BearerAuth: []
      summary: Mengubah transaksi
      tags:
      - Transactions
  /users:
    get:
      description: Menampilkan seluruh user pada sistem dengan paginasi dan pencarian
